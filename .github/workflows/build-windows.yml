name: Gerar ATENA-Setup.exe

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Ler versão do código
        id: versao
        shell: pwsh
        run: |
          $v = (Select-String -Path atena\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "v=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Testes (no Windows de verdade)
        run: python -m pytest -q

      - name: Baixar detector da palavra "Atena" (Vosk)
        shell: pwsh
        run: |
          Invoke-WebRequest https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip -OutFile vosk.zip
          Expand-Archive vosk.zip -DestinationPath modelos
          Rename-Item modelos/vosk-model-small-pt-0.3 vosk-pt

      - name: Embutir o reconhecimento de voz (Whisper small) — sem download na primeira vez
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-small', local_dir='modelos/whisper-small', allow_patterns=['*.bin','*.json','*.txt'])"

      - name: Gerar ATENA.exe (PyInstaller)
        run: pyinstaller atena.spec --noconfirm

      - name: Conferir se o .exe abre e carrega tudo
        shell: pwsh
        run: |
          $env:ATENA_VERIFICAR = "$PWD\verificar.txt"
          $p = Start-Process dist\ATENA\ATENA.exe -ArgumentList "--verificar" -Wait -PassThru
          Get-Content verificar.txt
          if ($p.ExitCode -ne 0) { Write-Error "o .exe não carregou tudo"; exit 1 }

      - name: Montar instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $env:ATENA_VERSAO = "${{ steps.versao.outputs.v }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" instalador\atena.iss
          Get-Item dist\ATENA-Setup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ATENA-Setup
          path: dist/ATENA-Setup.exe

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: dist/ATENA-Setup.exe
          name: ATENA v${{ steps.versao.outputs.v }}
          body: |
            **Baixe o `ATENA-Setup.exe` aqui embaixo, em Assets.**

            1. Abra o `ATENA-Setup.exe` (se o Windows avisar "app desconhecido", clique em *Mais informações → Executar assim mesmo*).
            2. Deixe marcado **Instalar o Ollama**.
            3. Abra a ATENA: na primeira vez aparece a apresentação e, no fim, o botão pra baixar o modelo de IA.
